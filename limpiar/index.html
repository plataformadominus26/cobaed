<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clear localStorage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h4 mb-3">Clear localStorage</h1>
                        <p class="text-muted mb-3">This page shows current localStorage items and lets you clear them.</p>

                        <div class="mb-3">
                            <button id="clearBtn" class="btn btn-danger me-2">Clear localStorage</button>
                            <button id="clearReloadBtn" class="btn btn-outline-danger">Clear and reload</button>
                        </div>

                        <div id="alert" class="alert alert-success py-2 d-none" role="alert">
                            localStorage cleared.
                        </div>

                        <div class="card mt-3">
                            <div class="card-body">
                                <h6 class="card-title mb-2">Items (<span id="count">0</span>)</h6>
                                <ul id="items" class="list-group list-group-flush">
                                    <li class="list-group-item text-muted">No items</li>
                                </ul>
                            </div>
                        </div>

                        <small class="text-muted d-block mt-3">Note: This affects storage for this origin only.</small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function updateStatus() {
            const count = localStorage.length;
            document.getElementById('count').textContent = count;
            const items = Object.keys(localStorage).map(k =>
                '<li class="list-group-item"><strong>' + escapeHtml(k) + '</strong>: ' + escapeHtml(localStorage.getItem(k)) + '</li>'
            ).join('');
            document.getElementById('items').innerHTML = items || '<li class="list-group-item text-muted">No items</li>';
        }

        function clearLocalStorage(showAlert = true) {
            localStorage.clear();
            updateStatus();
            if (showAlert) {
                const a = document.getElementById('alert');
                a.classList.remove('d-none');
                setTimeout(() => a.classList.add('d-none'), 2500);
            }
        }

        function escapeHtml(str = '') {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.getElementById('clearBtn').addEventListener('click', () => clearLocalStorage(true));
        document.getElementById('clearReloadBtn').addEventListener('click', () => {
            clearLocalStorage(false);
            location.reload();
        });

        // Initialize view
        updateStatus();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
