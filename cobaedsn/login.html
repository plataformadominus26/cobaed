<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App COBAED - Acceso</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  
    <style>
        :root {
            --primary-color: #1b5e20; /* Verde Oscuro COBAED */
            --secondary-color: #2e7d32; /* Verde Claro */
            --accent-color: #ffc107; /* Amarillo/Dorado para detalles */
            --bg-color: #f8f9fa;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header estilo App */
        .app-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-circle {
            width: 35px;
            height: 35px;
            background-color: white;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-right: 12px;
        }

        /* Contenedor del Login */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-top: 5px solid var(--secondary-color);
        }

        .mascot-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .mascot-img {
            width: 120px;
            transition: transform 0.3s ease;
        }
        
        .mascot-img:hover {
            transform: scale(1.05);
        }

        /* Ajustes de Bootstrap Floating Labels + Input Groups */
        .input-group-text {
            background-color: #f1f3f5;
            border-right: none;
            color: var(--primary-color);
        }

        .form-floating > .form-control {
            border-left: none;
        }

        .form-floating > .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
        
        /* Botón de ver contraseña */
        #btn-view-pass {
            cursor: pointer;
            background-color: #fff;
            border-left: none;
            color: #6c757d;
        }
        
        #btn-view-pass:active {
            color: var(--primary-color);
        }

        .btn-login {
            background-color: var(--secondary-color);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 50px;
            margin-top: 15px;
        }

        .btn-login:hover, .btn-login:active {
            background-color: var(--primary-color) !important;
        }

        .links-bottom {
            font-size: 0.9rem;
        }
        
        .links-bottom a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .links-bottom a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="logo-circle">B</div>
        <h5 class="m-0 fw-bold">COBAED Estudiantes</h5>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="mascot-container">
                <img src="assets/img/kobai.png" alt="Kobai" class="mascot-img" id="mascotImg">
                <h4 class="mt-3 text-secondary fw-bold">¡Bienvenido!</h4>
            </div>

            
                
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person-fill fs-4"></i></span>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="txtUser" placeholder="Usuario" required>
                        <label for="txtUser">Usuario / Matrícula</label>
                    </div>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock-fill fs-4"></i></span>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="txtPass" placeholder="Contraseña" required>
                        <label for="txtPass">Contraseña</label>
                    </div>
                    <button class="btn btn-outline-secondary" type="button" id="btn-view-pass">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3 fs-6">
                     
                    <a href="#" class="text-decoration-none small text-secondary">¿Olvidaste tu contraseña?</a>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-login btn-lg" id="btLogin">
                        INGRESAR
                    </button>
                </div>

                <div class="text-center mt-4 links-bottom">
                    <span class="text-muted">¿No tienes cuenta?</span><br>
                    <a href="#" class="fw-bold">Regístrate aquí</a>
                </div>

           
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/login.js?x=1"></script>
</body>
</html>
