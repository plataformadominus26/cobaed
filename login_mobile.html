<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App COBAED - Acceso</title>
    
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  
    <style>
        :root {
            --cobaed-green: #005931;       /* Verde Institucional */
            --cobaed-gold: #C49A50;        /* Dorado Institucional */
            --text-dark: #212529;
            --text-gray: #6c757d;
            --bg-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* Contenedor Principal */
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            max-width: 480px; /* Evita que se estire demasiado en tablets */
            margin: 0 auto;
        }

        /* 1. Branding Superior */
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .brand-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--cobaed-green);
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
            margin: 0;
        }
        
        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--cobaed-gold);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Mascota */
        .mascot-container {
            text-align: center;
            margin-bottom: 30px;
            animation: float 6s ease-in-out infinite;
        }

        .mascot-img {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1));
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* Inputs Modernos */
        .custom-input-group {
            border: 1px solid #e0e0e0;
            border-radius: 12px; /* Un poco menos redondeado para seriedad */
            background-color: #f8f9fa;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .custom-input-group:focus-within {
            border-color: var(--cobaed-green);
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0, 89, 49, 0.08);
        }

        .input-icon-start {
            padding-left: 15px;
            color: var(--cobaed-green);
            font-size: 1.2rem;
        }

        .form-floating {
            flex-grow: 1;
        }

        .form-floating > .form-control {
            border: none;
            box-shadow: none;
            background: transparent;
            height: calc(3.5rem + 2px);
        }

        .btn-view-pass {
            background: transparent;
            border: none;
            color: #b0b0b0;
            padding: 0 15px;
        }

        /* Botón Login Principal */
        .btn-login {
            background-color: var(--cobaed-green);
            color: white;
            border: none;
            padding: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0, 89, 49, 0.2);
            margin-top: 10px;
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }

        /* Separador "O conecta con" */
        .divider-container {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #adb5bd;
        }
        
        .divider-line {
            flex-grow: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .divider-text {
            margin: 0 10px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Botones Sociales / Invitado */
        .btn-social-google {
            background-color: white;
            color: var(--text-dark);
            border: 1px solid #e0e0e0;
            padding: 12px;
            border-radius: 50px;
            width: 100%;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        
        .btn-social-google:active {
            background-color: #f1f1f1;
        }

        .btn-guest {
            color: var(--text-gray);
            background: transparent;
            border: 1px dashed #ced4da;
            padding: 10px;
            border-radius: 50px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .btn-guest:active {
            background-color: #f8f9fa;
            color: var(--cobaed-green);
            border-color: var(--cobaed-green);
        }

        /* Footer */
        .register-section {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .register-link {
            color: var(--cobaed-green);
            font-weight: 700;
            text-decoration: none;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 15px;
            margin-top: -5px;
            text-decoration: none;
        }

    </style>
</head>
<body>

    <div class="container login-container">
        
        <div class="brand-header">
            <h1 class="brand-title">COBAED</h1>
            <div class="brand-subtitle">Estudiantes</div>
        </div>

        <div class="mascot-container">
            <img src="cobaedsn/assets/img/kobai.png" alt="Kobai Búho" class="mascot-img" id="mascotImg">
        </div>

        <form id="loginForm" autocomplete="off">
            
            <div class="custom-input-group">
                <span class="input-icon-start"><i class="bi bi-person"></i></span>
                <div class="form-floating">
                    <input type="text" class="form-control" id="txtUser" placeholder="Usuario" required>
                    <label for="txtUser">Usuario / Matrícula</label>
                </div>
            </div>

            <div class="custom-input-group">
                <span class="input-icon-start"><i class="bi bi-lock"></i></span>
                <div class="form-floating">
                    <input type="password" class="form-control" id="txtPass" placeholder="Contraseña" required>
                    <label for="txtPass">Contraseña</label>
                </div>
                <button type="button" class="btn-view-pass" id="btn-view-pass">
                    <i class="bi bi-eye-slash" id="icon-pass"></i>
                </button>
            </div>

            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>

            <button type="button" class="btn btn-login" id="btLogin">
                INGRESAR
            </button>

        </form>

        <div class="divider-container">
            <div class="divider-line"></div>
            <div class="divider-text">o accede con</div>
            <div class="divider-line"></div>
        </div>

        <button type="button" class="btn btn-social-google">
            <i class="bi bi-google"></i> Continuar con Google
        </button>

        <button type="button" class="btn btn-guest mt-2">
            <i class="bi bi-incognito me-1"></i> Entrar como Invitado
        </button>

        <div class="register-section">
            ¿No tienes cuenta? <a href="#" class="register-link">Regístrate aquí</a>
        </div>

    </div>

    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="api/apiCaller.js"></script>
    <script src="assets/js/alerts.js"></script>
    <script src="assets/js/login_mobile.js?v=1.03"></script>
    
    <script>
        $(document).ready(function() {
            // Lógica UI para ver contraseña
            $('#btn-view-pass').on('click', function() {
                const input = $('#txtPass');
                const icon = $('#icon-pass');
                
                if (input.attr('type') === 'password') {
                    input.attr('type', 'text');
                    icon.removeClass('bi-eye-slash').addClass('bi-eye');
                    $(this).css('color', 'var(--cobaed-green)');
                } else {
                    input.attr('type', 'password');
                    icon.removeClass('bi-eye').addClass('bi-eye-slash');
                    $(this).css('color', '#b0b0b0');
                }
            });

            // Listener botones nuevos (placeholder)
            $('.btn-social-google').click(function() {
                alert("Iniciando flujo de Google Auth...");
            });
            
            $('.btn-guest').click(function() {
                // Aquí redirigirías al dashboard en modo invitado
                window.location.href = 'dashboard_guest.html';
            });
        });
    </script>
</body>
</html>
